spring.application.name=fts

# profiles
spring.profiles.active=dev

# server config
server.port = 9999

# db configuration
spring.datasource.url= jdbc:mysql://localhost:3306/fts
spring.datasource.username= root
spring.datasource.password = root

# driver
spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver

# jpa/hibernate
spring.jpa.hibernate.ddl-auto= update

# Spring Security - OAuth2 Resource Server (JWT)
# spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
# spring.security.oauth2.resourceserver.jwt.audiences[0]=regtech-api


# DB_USERNAME=root
# DB_PASSWORD=your_password
# KEYCLOAK_ISSUER_URI=http://localhost:8180/realms/regtech

# JWT configuration
app.jwt.secret=uJ9n4kL2xP8vQ7mW5aB3cD6eF0gH1iK9lM2nO4pR5sQ=
app.jwt.access-token-expiration=900000

# Refresh token: 7 days
app.jwt.refresh-token-expiration=604800000

# Cookie settings
app.jwt.refresh-cookie-name=refreshToken
app.jwt.refresh-cookie-secure=true
app.jwt.refresh-cookie-same-site=Strict

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true


