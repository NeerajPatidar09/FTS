# =====================================================
# APPLICATION
# =====================================================
spring.application.name=fts

# =====================================================
# SERVER CONFIGURATION
# =====================================================
server.port=9090
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# =====================================================
# DATABASE CONFIGURATION - MYSQL
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3308/fts?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =====================================================
# JWT CONFIGURATION
# =====================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000

# Refresh token: 7 days
app.jwt.refresh-token-expiration=604800000

# =====================================================
# REFRESH TOKEN COOKIE
# =====================================================
app.jwt.refresh-cookie-name=refreshToken
app.jwt.refresh-cookie-secure=false
app.jwt.refresh-cookie-same-site=Strict

# =====================================================
# CORS CONFIGURATION
# =====================================================
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}

# =====================================================
# RATE LIMIT CONFIGURATION
# =====================================================
app.security.rate-limit.login-per-minute=5
app.security.rate-limit.mfa-per-minute=5
app.security.rate-limit.forgot-password-per-hour=3

# =====================================================
# MFA ENCRYPTION
# =====================================================
app.security.mfa-encryption-key=${MFA_ENCRYPTION_KEY}
app.encryption.key-v1= ${ENCRYPTION_KEY_PROVIDER}

# =====================================================
# MULTIPART / FILE UPLOAD
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# =====================================================
# DEVTOOLS
# =====================================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# =====================================================
# LOGGING
# =====================================================
logging.level.root=INFO
logging.level.com.yourcompany.fts=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=http://localhost:5173